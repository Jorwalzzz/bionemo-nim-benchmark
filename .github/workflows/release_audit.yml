name: Release Audit & Viewport Gate

on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  audit-site:
    name: Static Parity & Multi-Viewport Chromium Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Set Up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Playwright & Resolve Version
        id: pw
        run: |
          python -m pip install --upgrade pip
          pip install "playwright>=1.48.0"
          PW_VER=$(python -c "import importlib.metadata; print(importlib.metadata.version('playwright'))")
          echo "version=${PW_VER}" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright Chromium Binary
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Chromium & OS Dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" != "true" ]; then
            python -m playwright install --with-deps chromium
          else
            python -m playwright install-deps chromium
          fi

      - name: Run Automated Release Audits
        run: |
          set -o pipefail
          python scripts/audit/run_all_audits.py | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload Viewport & Theme Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-screenshots-pr-${{ github.event.pull_request.number || github.run_id }}
          path: audit/screenshots/
          if-no-files-found: warn
          retention-days: 14
