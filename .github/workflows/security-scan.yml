name: Supply Chain & Security Scan Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  security-audit:
    name: Bandit SAST, Pip-Audit CVE & Secret Pattern Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Security Scanners
        run: |
          python -m pip install --upgrade pip
          pip install "bandit[toml]>=1.7.5" "pip-audit>=2.6.0"

      - name: Run Bandit SAST Scan (Medium & High Severity)
        run: |
          bandit -r . -x ./tests,./.venv -ll

      - name: Run Pip-Audit Dependency CVE Gate
        run: |
          pip-audit .

      - name: Run Secret Pattern & Credential Leak Gate
        run: |
          python - << 'EOF'
          import subprocess
          import re
          import sys

          SECRET_PATTERNS = [
              (re.compile(r'nvapi-[A-Za-z0-9_-]{20,}'), 'NVIDIA API Key'),
              (re.compile(r'ghp_[0-9a-zA-Z]{36}'), 'GitHub Personal Access Token (classic)'),
              (re.compile(r'github_pat_[0-9a-zA-Z_]{82}'), 'GitHub Fine-grained PAT'),
              (re.compile(r'-----BEGIN (?:RSA |EC |OPENSSH |)PRIVATE KEY-----'), 'Private Key Header'),
          ]

          tracked_files = subprocess.check_output(['git', 'ls-files'], text=True).splitlines()
          violations = []

          for file_path in tracked_files:
              try:
                  with open(file_path, 'r', encoding='utf-8', errors='ignore') as fp:
                      for line_no, line in enumerate(fp, start=1):
                          for pattern, label in SECRET_PATTERNS:
                              if pattern.search(line):
                                  violations.append((file_path, line_no, label))
              except Exception:
                  pass

          if violations:
              print(f"[SECURITY ALERT] {len(violations)} secret pattern(s) detected in tracked repository files:")
              for fpath, lno, label in violations:
                  print(f"  - {fpath}:{lno} [{label}]")
              sys.exit(1)

          print(f"[PASS] 0 secret patterns detected across {len(tracked_files)} tracked repository files.")
          EOF
