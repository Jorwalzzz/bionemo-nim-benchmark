<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#05070a"/>
      <stop offset="100%" stop-color="#0d1322"/>
    </linearGradient>
    <linearGradient id="helixGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#76F5A2"/>
    </linearGradient>
    <linearGradient id="helixCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#5CE1FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Obsidian Background Badge -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="rgba(148, 163, 184, 0.2)" stroke-width="2"/>

  <!-- Molecular Strands -->
  <path d="M64 26 C84 26 98 42 98 62 C98 80 84 96 68 100" fill="none" stroke="url(#helixGreen)" stroke-width="8" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M64 26 C44 26 30 42 30 62 C30 78 44 94 60 100" fill="none" stroke="url(#helixCyan)" stroke-width="6" stroke-linecap="round"/>

  <!-- Hydrogen Cross-Bridges -->
  <line x1="42" y1="46" x2="86" y2="46" stroke="rgba(118, 245, 162, 0.4)" stroke-width="3" stroke-dasharray="3 3"/>
  <line x1="34" y1="64" x2="94" y2="64" stroke="rgba(92, 225, 255, 0.5)" stroke-width="3" stroke-dasharray="3 3"/>
  <line x1="42" y1="82" x2="86" y2="82" stroke="rgba(118, 245, 162, 0.4)" stroke-width="3" stroke-dasharray="3 3"/>

  <!-- Node Dots -->
  <circle cx="64" cy="26" r="6" fill="#76F5A2"/>
  <circle cx="68" cy="100" r="6" fill="#5CE1FF"/>
  <circle cx="64" cy="64" r="5" fill="#FFFFFF"/>
</svg>
